<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }
        #webcam-container canvas {
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #283593;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1a237e;
        }
        #label-container {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Fresh Apple Detector</h2>
    <button type="button" onclick="init()">Start Camera</button>
    
    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // Paste your actual Teachable Machine model URL here
        const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID_HERE/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Load the image model
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Setup the webcam (width, height, flip)
            const flip = true; 
            webcam = new tmImage.Webcam(400, 400, flip); 
            await webcam.setup(); // request access to the webcam
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Append webcam canvas to the DOM
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update(); // update the webcam frame
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            // Get predictions
            const prediction = await model.predict(webcam.canvas);
            
            // Update the text labels below the camera
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction = prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }

            // --- THE VISUAL BOX TRICK ---
            const ctx = webcam.canvas.getContext('2d');
            
            for (let i = 0; i < maxPredictions; i++) {
                // If it detects an apple (or fresh apple) with over 70% confidence
                if (prediction[i].className.toLowerCase().includes("apple") && prediction[i].probability > 0.70) {
                    
                    const boxWidth = 200;
                    const boxHeight = 200;
                    // Center the box on the canvas
                    const x = (webcam.canvas.width / 2) - (boxWidth / 2);
                    const y = (webcam.canvas.height / 2) - (boxHeight / 2);

                    // Draw the blue bounding box
                    ctx.strokeStyle = '#283593';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, boxWidth, boxHeight);

                    // Draw the blue label background
                    ctx.fillStyle = '#283593';
                    ctx.fillRect(x - 2, y - 26, 80, 24);

                    // Draw the white text
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 16px Arial';
                    ctx.textBaseline = 'top';
                    ctx.fillText("apple", x + 5, y - 22);
                    
                    break; // Stop looking once we draw the box
                }
            }
        }
    </script>
</body>
</html>
